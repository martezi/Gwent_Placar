<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gwent Físico</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #1A120B;
            --bg-wood: #3E2723;
            --bg-wood-dark: #2A1A17;
            --bg-leather: #4E342E;
            --bg-leather-dark: #362420;
            --bg-metal: #5D6D7E;
            --bg-metal-dark: #2C3E50;
            --color-gold: #C9A227;
            --color-gold-dark: #8B6914;
            --color-highlight: #E0C36A;
            --color-text: #F5E6C8;
            --color-text-sec: #CBB89D;

            --font-title: 'Cinzel', serif;
            --font-sec: 'Cormorant Garamond', serif;
            --font-ui: 'Montserrat', sans-serif;

            --shield-clip: polygon(0 0, 100% 0, 100% 75%, 50% 100%, 0 75%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Evita rolagem */
            background: radial-gradient(circle at center, #2A1C14 0%, var(--bg-main) 100%);
            color: var(--color-text);
            font-family: var(--font-ui);
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        header {
            flex: 0 0 auto;
            background: linear-gradient(180deg, var(--bg-wood), var(--bg-wood-dark));
            border-bottom: 2px solid var(--color-gold-dark);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            height: 8vh;
            min-height: 50px;
            z-index: 10;
        }

        .logo {
            font-family: var(--font-title);
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            color: var(--color-highlight);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }

        .menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu a {
            color: var(--color-text-sec);
            text-decoration: none;
            font-family: var(--font-sec);
            font-weight: 600;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .menu a:hover {
            color: var(--color-highlight);
            text-shadow: 0 0 5px var(--color-highlight);
        }

        .menu .separator {
            color: var(--bg-metal);
            font-size: 0.8rem;
            transform: rotate(45deg);
        }

        main {
            flex: 1 1 auto;
            display: flex;
            flex-direction: row;
            padding: 2vh 2vw;
            gap: 2vw;
            overflow: hidden;
        }

        .board {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 2vh;
        }

        .half-board {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 1vh 1vw;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            border: 1px solid rgba(201, 162, 39, 0.1);
        }

        .board-divider {
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--color-gold-dark), transparent);
            box-shadow: 0 0 10px var(--color-gold-dark);
            margin: 0.5vh 0;
            border-radius: 50%;
        }

        .row {
            display: flex;
            align-items: center;
            height: 12vh;
            gap: 15px;
        }

        .shield-input-wrapper {
            flex: 0 0 auto;
            width: clamp(50px, 8vw, 70px);
            height: clamp(60px, 10vw, 85px);
            background: linear-gradient(to bottom, var(--color-highlight), var(--color-gold-dark));
            padding: 3px;
            clip-path: var(--shield-clip);
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.6));
        }

        .shield-input-inner {
            background: linear-gradient(to bottom, var(--bg-metal), var(--bg-metal-dark));
            width: 100%;
            height: 100%;
            clip-path: var(--shield-clip);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 15%;
        }

        .score-input {
            width: 90%;
            background: transparent;
            border: none;
            color: var(--color-highlight);
            font-family: var(--font-title);
            font-size: clamp(1.2rem, 4vw, 2rem);
            font-weight: 700;
            text-align: center;
            outline: none;
        }

        .score-input::-webkit-outer-spin-button,
        .score-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .score-input[type=number] {
            appearance: textfield;
            -moz-appearance: textfield;
        }

        .row-content {
            flex: 1;
            height: 100%;
            background: linear-gradient(90deg, var(--bg-leather), var(--bg-leather-dark));
            border: 2px solid var(--bg-wood);
            border-radius: 6px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 5px 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .row-icon-bg {
            position: absolute;
            font-size: clamp(3rem, 8vw, 5rem);
            color: rgba(245, 230, 200, 0.05); /* Marca d'água */
            z-index: 1;
        }

        .row-info {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--color-text-sec);
            opacity: 0.6;
        }

        .row-info i {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
        }

        .row-info span {
            font-family: var(--font-title);
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            letter-spacing: 2px;
        }

        aside {
            flex: 0 0 clamp(150px, 20vw, 250px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4vh;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            border: 1px solid rgba(201, 162, 39, 0.2);
            padding: 20px;
        }

        .score-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .score-label {
            font-family: var(--font-title);
            color: var(--color-text-sec);
            font-size: clamp(1rem, 2vw, 1.4rem);
            letter-spacing: 2px;
            text-shadow: 0 2px 4px #000;
        }

        .shield-total-wrapper {
            width: clamp(80px, 12vw, 120px);
            height: clamp(95px, 15vw, 145px);
            background: linear-gradient(to bottom, var(--color-highlight), var(--color-gold-dark));
            padding: 5px;
            clip-path: var(--shield-clip);
            transition: all 0.3s;
        }

        .shield-total-inner {
            background: linear-gradient(to bottom, #2C3E50, #1A252F);
            width: 100%;
            height: 100%;
            clip-path: var(--shield-clip);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20%;
        }

        .total-score {
            font-family: var(--font-title);
            color: var(--color-highlight);
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            text-shadow: 0 0 10px rgba(224, 195, 106, 0.5);
        }

        .pulse-anim {
            animation: shield-glow 0.4s ease-out;
        }

        @keyframes shield-glow {
            0% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(224,195,106,0)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 25px rgba(224,195,106,1)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(224,195,106,0)); }
        }

        .reset-btn {
            margin-top: 2vh;
            background: linear-gradient(180deg, var(--bg-wood), var(--bg-wood-dark));
            border: 1px solid var(--color-gold-dark);
            color: var(--color-text);
            font-family: var(--font-title);
            padding: 12px 20px;
            font-size: clamp(0.8rem, 1.5vw, 1rem);
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.8);
            transition: all 0.3s;
            width: 100%;
        }

        .reset-btn:hover {
            border-color: var(--color-highlight);
            color: var(--color-highlight);
            box-shadow: 0 0 15px rgba(201, 162, 39, 0.4);
        }

        @media (max-width: 900px) {
            main {
                flex-direction: column;
                padding: 1vh 2vw;
            }

            aside {
                flex-direction: row;
                flex: 0 0 auto;
                width: 100%;
                padding: 10px;
                gap: 15px;
                justify-content: space-around;
            }

            .score-display {
                flex-direction: row;
                align-items: center;
                gap: 15px;
            }

            .shield-total-wrapper {
                width: 60px;
                height: 70px;
                padding: 3px;
            }

            .total-score {
                font-size: 1.8rem;
                padding-top: 5%;
            }

            .reset-btn {
                margin-top: 0;
                width: auto;
                padding: 8px 15px;
                font-size: 0.8rem;
            }

            .board {
                gap: 1vh;
            }

            .row {
                height: 10vh;
            }

            .shield-input-wrapper {
                width: 45px;
                height: 55px;
            }

            .score-input {
                font-size: 1.2rem;
                padding-top: 5%;
            }

            .menu { display: none; }

            .logo { font-size: 1.2rem; width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="logo">GWENT SCORE</div>
            <nav class="menu">
                <a href="#">REGRAS</a>
                <i class="fa-solid fa-khanda separator"></i>
                <a href="#">ATUALIZAÇÕES</a>
                <i class="fa-solid fa-khanda separator"></i>
                <a href="#">SUPORTE</a>
            </nav>
        </header>

        <main>
            <aside>
                <div class="score-display">
                    <span class="score-label">JOGADOR 1</span>
                    <div class="shield-total-wrapper" id="adv-shield">
                        <div class="shield-total-inner">
                            <span class="total-score" id="adv-total">0</span>
                        </div>
                    </div>
                </div>

                <div class="score-display">
                    <span class="score-label">JOGADOR 2</span>
                    <div class="shield-total-wrapper" id="player-shield">
                        <div class="shield-total-inner">
                            <span class="total-score" id="player-total">0</span>
                        </div>
                    </div>
                </div>

                <button class="reset-btn" onclick="resetGame()">ZERAR PARTIDA</button>
            </aside>

            <div class="board">

                <div class="half-board">
                    <div class="row">
                        <div class="shield-input-wrapper">
                            <div class="shield-input-inner">
                                <input type="number" class="score-input adv-input" value="0" min="0" oninput="updateScores()">
                            </div>
                        </div>
                        <div class="row-content">
                            <i class="fa-solid fa-chess-rook row-icon-bg"></i>
                            <div class="row-info">
                                <i class="fa-solid fa-chess-rook"></i>
                                <span>LINHA DE CERCO</span>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="shield-input-wrapper">
                            <div class="shield-input-inner">
                                <input type="number" class="score-input adv-input" value="0" min="0" oninput="updateScores()">
                            </div>
                        </div>
                        <div class="row-content">
                            <i class="fa-solid fa-bullseye row-icon-bg"></i>
                            <div class="row-info">
                                <i class="fa-solid fa-bullseye"></i>
                                <span>LONGA DISTÂNCIA</span>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="shield-input-wrapper">
                            <div class="shield-input-inner">
                                <input type="number" class="score-input adv-input" value="0" min="0" oninput="updateScores()">
                            </div>
                        </div>
                        <div class="row-content">
                            <i class="fa-solid fa-khanda row-icon-bg"></i>
                            <div class="row-info">
                                <i class="fa-solid fa-khanda"></i>
                                <span>CORPO A CORPO</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="board-divider"></div>

                <div class="half-board">
                    <div class="row">
                        <div class="shield-input-wrapper">
                            <div class="shield-input-inner">
                                <input type="number" class="score-input player-input" value="0" min="0" oninput="updateScores()">
                            </div>
                        </div>
                        <div class="row-content">
                            <i class="fa-solid fa-khanda row-icon-bg"></i>
                            <div class="row-info">
                                <i class="fa-solid fa-khanda"></i>
                                <span>CORPO A CORPO</span>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="shield-input-wrapper">
                            <div class="shield-input-inner">
                                <input type="number" class="score-input player-input" value="0" min="0" oninput="updateScores()">
                            </div>
                        </div>
                        <div class="row-content">
                            <i class="fa-solid fa-bullseye row-icon-bg"></i>
                            <div class="row-info">
                                <i class="fa-solid fa-bullseye"></i>
                                <span>LONGA DISTÂNCIA</span>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="shield-input-wrapper">
                            <div class="shield-input-inner">
                                <input type="number" class="score-input player-input" value="0" min="0" oninput="updateScores()">
                            </div>
                        </div>
                        <div class="row-content">
                            <i class="fa-solid fa-chess-rook row-icon-bg"></i>
                            <div class="row-info">
                                <i class="fa-solid fa-chess-rook"></i>
                                <span>LINHA DE CERCO</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        let lastAdvTotal = 0;
        let lastPlayerTotal = 0;

        function updateScores() {
            const advInputs = document.querySelectorAll('.adv-input');
            const playerInputs = document.querySelectorAll('.player-input');

            let advSum = 0;
            advInputs.forEach(input => {
                let val = parseInt(input.value, 10);
                if (isNaN(val) || val < 0) val = 0;
                advSum += val;
            });

            let playerSum = 0;
            playerInputs.forEach(input => {
                let val = parseInt(input.value, 10);
                if (isNaN(val) || val < 0) val = 0;
                playerSum += val;
            });

            const advTotalElement = document.getElementById('adv-total');
            const playerTotalElement = document.getElementById('player-total');
            const advShield = document.getElementById('adv-shield');
            const playerShield = document.getElementById('player-shield');

            if (advSum !== lastAdvTotal) {
                advTotalElement.innerText = advSum;
                triggerAnimation(advShield);
                lastAdvTotal = advSum;
            }

            if (playerSum !== lastPlayerTotal) {
                playerTotalElement.innerText = playerSum;
                triggerAnimation(playerShield);
                lastPlayerTotal = playerSum;
            }
        }

        function triggerAnimation(element) {
            element.classList.remove('pulse-anim');
            void element.offsetWidth;
            element.classList.add('pulse-anim');
        }

        function resetGame() {
            const confirmReset = window.confirm("Deseja realmente zerar todos os pontos da partida atual?");

            if (confirmReset) {
                const allInputs = document.querySelectorAll('.score-input');
                allInputs.forEach(input => {
                    input.value = "0";
                });
                updateScores();
            }
        }

        document.querySelectorAll('.score-input').forEach(input => {
            input.addEventListener('focus', function() {
                this.select();
            });
            input.addEventListener('blur', function() {
                if (this.value === "") {
                    this.value = "0";
                    updateScores();
                }
            });
        });
    </script>
</body>
</html>
